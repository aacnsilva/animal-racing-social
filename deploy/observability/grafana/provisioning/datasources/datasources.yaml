apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: vm
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      prometheusType: Prometheus

  - name: VictoriaLogs
    uid: vlogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: Trace
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: jaeger
          url: $${__value.raw}
          urlDisplayLabel: Open trace

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: vlogs
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: trace_id:="$${__trace.traceId}"
      nodeGraph:
        enabled: true
