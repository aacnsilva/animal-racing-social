apiVersion: 1

policies:
  - orgId: 1
    receiver: discord
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 6h
    routes:
      - receiver: discord
        object_matchers:
          - [severity, =, critical]
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 1h
