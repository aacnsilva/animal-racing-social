[workspace]
resolver = "3"
members = [
    "crates/race-engine-core",
    "crates/ars-proto",
    "crates/ars-infra",
    "services/race-engine",
    "services/race-broadcaster",
    "services/odds-engine",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
race-engine-core = { path = "crates/race-engine-core" }
ars-proto = { path = "crates/ars-proto" }
ars-infra = { path = "crates/ars-infra" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = "0.10"
rand_chacha = "0.10"
sha2 = "0.11"
hex = "0.4"
libm = "0.2"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
rdkafka = { version = "0.39", default-features = false, features = ["tokio"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
aes-gcm = "0.11"
zstd = { version = "0.14", default-features = false }
getrandom = "0.4"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime", "experimental_metrics_periodicreader_with_async_runtime"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "hyper-client", "trace", "metrics"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "env-filter"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package.race-engine-core]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
